apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: medinsights
  labels:
    app: frontend
    component: ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        component: ui
    spec:
      initContainers:
      - name: wait-for-kong
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z kong-gateway 8000; do echo waiting for kong-gateway; sleep 2; done;']
      
      containers:
      - name: frontend
        image: medinsights/frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          name: http
          protocol: TCP
        
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
        
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 30
          timeoutSeconds: 3
