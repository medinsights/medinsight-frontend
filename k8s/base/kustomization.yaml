apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: medinsights

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

commonLabels:
  app.kubernetes.io/name: frontend
  app.kubernetes.io/component: ui
  app.kubernetes.io/part-of: medinsights
  app.kubernetes.io/managed-by: kustomize

images:
  - name: medinsights/frontend
    newName: medinsights/frontend
    newTag: latest
